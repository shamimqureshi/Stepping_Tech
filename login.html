<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | SteppingTech</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #8db63c;
        --bg-main: #121518;
        --surface: #1a1d21;
        --border: #2f353b;
        --text: #f2f4f5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        background-color: var(--bg-main);
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(141, 182, 60, 0.1) 0%,
          transparent 60%
        );
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        padding: 3rem 2.5rem;
        border-radius: 24px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        text-align: center;
      }
      .login-card i.lock-icon {
        font-size: 2.5rem;
        color: var(--brand);
        margin-bottom: 1rem;
      }
      .login-card h2 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }
      .login-card p {
        color: #9ba5ac;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }
      .input-group {
        position: relative;
        margin-bottom: 1.2rem;
      }
      .input-group i {
        position: absolute;
        left: 1rem;
        top: 1.1rem;
        color: #9ba5ac;
      }
      .input-group input {
        width: 100%;
        padding: 1rem 1rem 1rem 3rem;
        background: #23282d;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        outline: none;
        transition: 0.3s;
      }
      .input-group input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(141, 182, 60, 0.2);
      }
      .login-btn {
        width: 100%;
        padding: 1rem;
        background: var(--brand);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 1rem;
      }
      .login-btn:hover {
        background: #6e9a2e;
        transform: translateY(-2px);
      }
      .error-msg {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 1rem;
        display: none;
      }
      @media (max-width: 400px) {
        .login-card {
          padding: 2rem 1.5rem;
          border-radius: 18px;
        }
        .login-card h2 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <i class="fas fa-user-shield lock-icon"></i>
      <h2>Admin Portal</h2>
      <p>Please enter your credentials to access the dashboard.</p>

      <form id="loginForm" autocomplete="on">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
          />
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="login-btn">
          Sign In <i class="fas fa-arrow-right"></i>
        </button>
        <p id="errorMsg" class="error-msg">Invalid Credentials!</p>
      </form>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const user = document.getElementById("username").value;
          const pass = document.getElementById("password").value;
          const error = document.getElementById("errorMsg");

          // Local dev fallback — replace with backend call before going public
          if (user === "admin" && pass === "steppingtech123") {
            localStorage.setItem("isAdminLoggedIn", "true");
            window.location.href = "index.html";
          } else {
            error.style.display = "block";
          }
        });
    </script>
  </body>
</html>
